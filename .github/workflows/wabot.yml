name: WhatsApp bot

on:
  schedule:
    - cron: "8 */6 * * *"
  workflow_dispatch:

# Never run two sessions against the same number at once.
concurrency:
  group: wabot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # GitHub kills any job at 6 hours. Leave headroom for setup + saving state.
    timeout-minutes: 355

    defaults:
      run:
        shell: bash
        working-directory: bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Restore session
        uses: actions/cache/restore@v4
        with:
          path: |
            bot/auth
            bot/orders.json
            bot/.paused.json
            bot/.counters.json
          key: wabot-${{ github.run_id }}
          restore-keys: |
            wabot-

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Create .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set. Repo > Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf 'GEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-3.5-flash-lite\n' "$GEMINI_API_KEY" > .env

      # Optional: keeps business.md (pricing) out of the public repo.
      - name: Apply private business profile
        env:
          BUSINESS_MD: ${{ secrets.BUSINESS_MD }}
        run: |
          if [ -n "$BUSINESS_MD" ]; then
            printf '%s\n' "$BUSINESS_MD" > business.md
            echo "Using BUSINESS_MD secret instead of the committed file."
          fi

      - name: Run bot
        run: |
          echo "::notice::Open this run, watch the 'Run bot' step live, and scan the QR code."
          set +e
          timeout --signal=INT --kill-after=60s 345m node index.js
          code=$?
          set -e
          echo "bot exited with code $code"
          # 124 = reached the time limit (expected), 130/143 = stopped by our signal
          if [ "$code" -ne 124 ] && [ "$code" -ne 130 ] && [ "$code" -ne 143 ]; then
            exit "$code"
          fi

      - name: Make sure state files exist
        if: always()
        run: mkdir -p auth && touch orders.json .paused.json .counters.json

      - name: Save session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot/auth
            bot/orders.json
            bot/.paused.json
            bot/.counters.json
          key: wabot-${{ github.run_id }}
